version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: repaso-bbdd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repaso_bd
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - repaso_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  repaso_data:
